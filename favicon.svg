<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient for Accent Dot -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#D4A843" />
      <stop offset="100%" stop-color="#B38423" />
    </linearGradient>
    
    <!-- Soft Ambient Radial Glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A843" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D4A843" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .bg-card { fill: #FFFFFF; transition: fill 0.3s ease; }
    .logo-text { fill: #0B1325; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
    
    @media (prefers-color-scheme: dark) {
      .bg-card { fill: #0F172A; }
      .logo-text { fill: #F8FAFC; }
    }
  </style>

  <!-- Clean Rounded Container Card -->
  <rect class="bg-card" width="512" height="512" rx="112" />

  <!-- Main Logo Text 'NR.' -->
  <text x="165" y="310" class="logo-text" font-size="210" letter-spacing="-6">NR.</text>

  <!-- Accent Golden Dot at Bottom Right -->
  <circle cx="418" cy="392" r="32" fill="url(#goldGlow)" />
  <circle cx="418" cy="392" r="20" fill="url(#goldGrad)" />
</svg>